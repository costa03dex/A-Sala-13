<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>A SALA 13</title>

<style>
:root{
  color-scheme:dark;
  --bg:#080808;
  --panel:#171717;
  --line:#666;
  --text:#f4f4f4;
  --muted:#bbb;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{
  width:100%;
  min-height:100%;
  margin:0;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}
button{
  font:inherit;
  cursor:pointer;
  touch-action:manipulation;
}
button:focus-visible,[role="button"]:focus-visible{
  outline:3px solid white;
  outline-offset:3px;
}
button:disabled{opacity:.4;cursor:not-allowed}
.screen{
  display:none;
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}
.screen.active{display:flex}
#menu,#intro,#ending{
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow-y:auto;
  padding:
    calc(16px + var(--safe-top))
    calc(16px + var(--safe-right))
    calc(16px + var(--safe-bottom))
    calc(16px + var(--safe-left));
  background:radial-gradient(circle,#353535,#080808 75%);
}
.menu-box,.intro-box,.ending-box{
  width:min(100%,760px);
  margin:auto;
}
.logo{
  margin:0 0 18px;
  font-size:clamp(38px,9vw,90px);
  font-weight:900;
  letter-spacing:clamp(2px,1vw,8px);
  text-shadow:0 0 25px #777;
}
.subtitle{
  color:#bbb;
  font-size:clamp(14px,2.7vw,18px);
  line-height:1.5;
  margin-bottom:28px;
}
.btn{
  border:1px solid #777;
  border-radius:10px;
  background:#252525;
  color:white;
  padding:14px 20px;
  min-height:48px;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:#393939;border-color:white}
.btn:active{background:#555}
.menu-button{
  display:block;
  width:min(100%,320px);
  margin:12px auto;
  font-weight:bold;
}
.intro-text{
  font-size:clamp(21px,4vw,36px);
  font-weight:bold;
  line-height:1.5;
  min-height:100px;
  display:grid;
  place-items:center;
}
.intro-controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:24px;
}
#selection{
  display:none;
  align-items:flex-start;
  justify-content:center;
  overflow-y:auto;
  padding:
    calc(22px + var(--safe-top))
    calc(12px + var(--safe-right))
    calc(25px + var(--safe-bottom))
    calc(12px + var(--safe-left));
  background:radial-gradient(circle at top,#292929,#080808 70%);
}
#selection.active{display:flex}
.selection-box{
  width:min(100%,1180px);
  margin:auto;
  text-align:center;
}
.selection-title{
  margin:0 0 8px;
  font-size:clamp(23px,4vw,40px);
}
.selection-description{
  color:#bbb;
  line-height:1.4;
}
.character-carousel{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:16px;
}
.characters{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  min-width:0;
  flex:1;
  padding:10px 5px 20px;
}
.character-card{
  flex:0 0 clamp(170px,27vw,235px);
  scroll-snap-align:center;
  background:#171717;
  border:2px solid #444;
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  min-height:280px;
  cursor:pointer;
  text-align:center;
}
.character-card.selected{
  border-color:white;
  background:#333;
}
.character-card.selected:after{
  content:"✓ SELECIONADO";
  font-size:11px;
  font-weight:bold;
}
.character-card img{
  display:block;
  width:100%;
  height:clamp(145px,21vw,220px);
  object-fit:contain;
}
.character-name{
  font-weight:bold;
  font-size:16px;
}
.character-trait{
  font-size:12px;
  line-height:1.35;
  color:#ccc;
}
.carousel-arrow{
  flex:0 0 44px;
  height:48px;
  padding:0;
  font-size:24px;
}
.start-game{
  display:block;
  width:min(100%,300px);
  margin:22px auto 0;
  background:#ddd;
  color:#111;
  font-weight:bold;
}
#game{
  flex-direction:column;
  min-height:0;
  padding-top:var(--safe-top);
  padding-left:var(--safe-left);
  padding-right:var(--safe-right);
  padding-bottom:var(--safe-bottom);
  background:black;
}
.game-scene{
  position:relative;
  flex:1 1 auto;
  min-height:70px;
  overflow:hidden;
  isolation:isolate;
}
#background{
  position:absolute;
  width:100%;
  height:100%;
  inset:0;
  object-fit:cover;
  object-position:center;
}
.scene-dark{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.12),
    rgba(0,0,0,.05) 40%,
    rgba(0,0,0,.75)
  );
  pointer-events:none;
}
.hud{
  position:absolute;
  top:clamp(5px,1.5vh,15px);
  left:clamp(6px,2vw,18px);
  right:clamp(6px,2vw,18px);
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  z-index:5;
  pointer-events:none;
}
.hud-box{
  background:rgba(8,8,8,.84);
  border:1px solid #555;
  border-radius:8px;
  padding:clamp(5px,1vw,10px);
  backdrop-filter:blur(5px);
  max-width:70%;
}
.hud-name{
  font-size:clamp(12px,1.7vw,16px);
  font-weight:bold;
}
.hud-sub,.hud-clues{
  color:#ccc;
  font-size:clamp(10px,1.3vw,13px);
  margin-top:3px;
}
.character-sprite,.speaker-sprite{
  position:absolute;
  bottom:0;
  height:clamp(90px,70%,560px);
  width:auto;
  max-width:43%;
  object-fit:contain;
  object-position:bottom center;
  z-index:3;
  pointer-events:none;
  filter:drop-shadow(0 9px 16px #000);
  transition:opacity .2s ease;
}
.character-sprite{
  left:50%;
  transform:translateX(calc(-100% - 8px));
}
.speaker-sprite{
  left:50%;
  transform:translateX(8px);
}
.player-center{
  left:50%;
  max-width:65%;
  height:clamp(100px,82%,650px);
  transform:translateX(-50%);
}
.hidden-sprite{
  opacity:0;
  visibility:hidden;
}
.dialogue-area{
  position:relative;
  flex:0 0 auto;
  width:100%;
  max-height:min(62dvh,470px);
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  background:#090909;
  border-top:1px solid #444;
  padding:clamp(9px,2vw,19px);
}
.dialogue-box{
  width:min(100%,1100px);
  margin:auto;
}
.speaker{
  display:inline-block;
  font-weight:bold;
  font-size:clamp(12px,1.8vw,16px);
  padding:7px 14px;
  min-width:100px;
  background:#333;
  border:1px solid #666;
  border-radius:8px 8px 0 0;
}
.speaker.protagonist{
  background:#555;
  border-color:#aaa;
}
.dialogue-text{
  border:1px solid #555;
  border-radius:0 9px 9px 9px;
  background:#181818;
  padding:clamp(10px,2vw,20px);
  font-size:clamp(15px,1.9vw,19px);
  line-height:1.45;
  min-height:54px;
  overflow-wrap:anywhere;
}
.dialogue-controls{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  margin-top:9px;
}
.continue-button{
  min-height:44px;
  padding:9px 22px;
  font-weight:bold;
}
.continue-button[hidden]{display:none}
.choice-question{
  display:none;
  margin:14px 0 10px;
  text-align:center;
  font-weight:900;
  font-size:clamp(14px,2.1vw,20px);
  letter-spacing:.3px;
}
.choice-question.active{display:block}
.choices{
  display:none;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:10px;
}
.choices.active{display:grid}
.choice{
  min-height:50px;
  padding:13px;
  display:flex;
  align-items:center;
  text-align:left;
  gap:10px;
  background:#242424;
  color:white;
  border:1px solid #777;
  border-radius:10px;
  line-height:1.35;
  font-size:clamp(14px,1.6vw,17px);
}
.choice:hover,.choice:focus-visible{
  background:#404040;
  border-color:white;
}
.choice:active{background:#606060}
.choice-number{
  flex:0 0 28px;
  height:28px;
  display:grid;
  place-items:center;
  background:#555;
  border-radius:50%;
  font-weight:bold;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:
    calc(14px + var(--safe-top))
    calc(14px + var(--safe-right))
    calc(14px + var(--safe-bottom))
    calc(14px + var(--safe-left));
  background:rgba(0,0,0,.88);
}
.modal.active{display:flex}
.modal-box{
  width:min(100%,650px);
  max-height:90%;
  overflow-y:auto;
  padding:clamp(16px,3vw,28px);
  background:#181818;
  border:1px solid #777;
  border-radius:12px;
}
.modal-box h2{margin-top:0}
.modal-box p{
  font-size:clamp(15px,2vw,18px);
  line-height:1.6;
}
.ending-title{
  font-size:clamp(30px,6vw,65px);
  font-weight:900;
  margin:0 0 20px;
}
.ending-text{
  font-size:clamp(15px,2.1vw,19px);
  line-height:1.7;
}
@media(max-width:600px){
  .logo{letter-spacing:2px}
  .choices{grid-template-columns:1fr}
  .character-card{flex-basis:190px}
  .character-card img{height:175px}
  .carousel-arrow{flex-basis:38px}
  .dialogue-area{max-height:57dvh}
}
@media(max-width:600px) and (orientation:portrait){
  .game-scene{flex:1 1 43%}
  .dialogue-area{max-height:55dvh}
  .character-sprite,.speaker-sprite{
    max-width:47%;
    height:78%;
  }
  .player-center{
    max-width:70%;
    height:87%;
  }
}
@media(orientation:landscape) and (max-height:550px){
  .game-scene{flex:1 1 auto}
  .dialogue-area{
    flex:0 0 auto;
    max-height:65dvh;
    padding:6px 12px;
  }
  .dialogue-text{
    min-height:0;
    padding:7px 11px;
    font-size:clamp(13px,2.2vh,16px);
    line-height:1.3;
  }
  .speaker{
    padding:4px 10px;
    font-size:12px;
  }
  .dialogue-controls{margin-top:5px}
  .continue-button{
    min-height:38px;
    padding:6px 16px;
  }
  .choice-question{
    margin:7px 0 5px;
    font-size:13px;
  }
  .choices{gap:7px;margin-top:6px}
  .choice{
    min-height:40px;
    padding:7px 10px;
    font-size:13px;
  }
  .character-sprite,.speaker-sprite{
    height:94%;
    max-width:34%;
  }
  .player-center{
    height:96%;
    max-width:45%;
  }
  .hud-box{padding:4px 7px}
  .hud-sub{font-size:10px}
  .character-card{
    min-height:180px;
    flex-basis:145px;
    padding:7px;
  }
  .character-card img{height:90px}
  #selection{padding-top:10px}
  .selection-title{font-size:23px}
  .selection-description{margin:5px}
  .start-game{margin-top:8px}
}
@media(max-height:350px) and (orientation:landscape){
  .dialogue-area{max-height:72dvh}
  .choice{min-height:36px}
  .intro-text{min-height:35px;font-size:20px}
}
@media(min-width:900px) and (min-height:700px){
  .game-scene{flex:1 1 65%}
  .dialogue-area{max-height:43dvh}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>

<body>

<section id="menu" class="screen active">
  <div class="menu-box">
    <h1 class="logo">A SALA 13</h1>
    <p class="subtitle">
      Um mistério escolar onde nada é o que parece.
    </p>
    <button class="btn menu-button" onclick="startIntro()">
      COMEÇAR
    </button>
    <button class="btn menu-button" onclick="continueGame()">
      CONTINUAR
    </button>
  </div>
</section>

<section id="intro" class="screen">
  <div class="intro-box">
    <div id="introText" class="intro-text"></div>
    <div class="intro-controls">
      <button class="btn" onclick="nextIntro()">CONTINUAR</button>
      <button class="btn" onclick="skipIntro()">PULAR INTRO</button>
    </div>
  </div>
</section>

<section id="selection" class="screen">
  <div class="selection-box">
    <h1 class="selection-title">Escolha seu personagem</h1>
    <p class="selection-description">
      Você controlará esse personagem durante toda a história.
    </p>
    <div class="character-carousel">
      <button class="btn carousel-arrow"
        aria-label="Personagem anterior"
        onclick="scrollCharacters(-1)">‹</button>
      <div id="characters" class="characters"></div>
      <button class="btn carousel-arrow"
        aria-label="Próximo personagem"
        onclick="scrollCharacters(1)">›</button>
    </div>
    <p class="selection-description">
      Arraste para os lados para ver os personagens.
    </p>
    <button id="startButton" class="btn start-game"
      onclick="startGame()" disabled>
      ENTRAR NA HISTÓRIA
    </button>
  </div>
</section>

<section id="game" class="screen">
  <div class="game-scene">
    <img id="background" src="sala-aula.png" alt="Cenário">
    <div class="scene-dark"></div>
    <div class="hud">
      <div class="hud-box">
        <div id="hudName" class="hud-name">-</div>
        <div id="hudAbility" class="hud-sub">-</div>
      </div>
      <div class="hud-box">
        <div class="hud-clues">PISTAS</div>
        <div id="clueCount">0 / 7</div>
      </div>
    </div>
    <img id="characterSprite"
      class="character-sprite hidden-sprite"
      alt="Personagem do jogador">
    <img id="speakerSprite"
      class="speaker-sprite hidden-sprite"
      alt="Personagem falando">
  </div>
  <div class="dialogue-area" id="dialogueArea">
    <div class="dialogue-box">
      <div id="speaker" class="speaker">Narrador</div>
      <div id="dialogueText" class="dialogue-text"
        aria-live="polite"></div>
      <div class="dialogue-controls">
        <button id="continueButton"
          class="btn continue-button"
          onclick="advanceDialogue()">
          CONTINUAR ›
        </button>
      </div>
      <div id="choiceQuestion" class="choice-question">
        COMO VOCÊ VAI REAGIR DIANTE DISSO?
      </div>
      <div id="choices" class="choices"></div>
    </div>
  </div>
</section>

<section id="ending" class="screen">
  <div class="ending-box">
    <h1 id="endingTitle" class="ending-title"></h1>
    <p id="endingText" class="ending-text"></p>
    <button class="btn menu-button" onclick="restartGame()">
      JOGAR NOVAMENTE
    </button>
  </div>
</section>

<div id="clueModal" class="modal" role="dialog"
  aria-modal="true" aria-labelledby="clueTitle">
  <div class="modal-box">
    <h2 id="clueTitle">PISTA ENCONTRADA</h2>
    <p id="clueDescription"></p>
    <button class="btn" onclick="closeClue()">CONTINUAR</button>
  </div>
</div>

  {id:"cantina",name:"Cantina"},
  {id:"quadra",name:"Quadra"},
  {id:"direcao",name:"Direção"}
];

const clueData={
  biblioteca:{
    title:"PLANTA ANTIGA",
    description:"Entre livros antigos, a turma encontra uma planta antiga da escola. Uma sala aparece no documento, mas não existe na planta atual: SALA 13.",
    reaction:[
      ["Rosana","Essa planta é antiga. Tem alguma coisa muito errada aqui."],
      ["Anna Laura","Se a Sala 13 aparece nessa planta, então ela existiu."],
      ["Fernanda","Olhem melhor. Tem uma parte da planta que foi apagada."]
    ],
    actions:["Comparar as plantas da escola","Examinar a parte apagada"]
  },
  robotica:{
    title:"O SISTEMA",
    description:"Mara encontra registros no computador. O bloqueio automático da escola começou exatamente às 13:13.",
    reaction:[
      ["Mara","O sistema foi bloqueado exatamente às 13:13."],
      ["Kaio","Então alguém programou isso?"],
      ["João Arthur","Isso significa que alguém preparou tudo antes."]
    ],
    actions:["Analisar a programação","Procurar quem enviou o comando"]
  },
  matematica:{
    title:"O PAINEL",
    description:"Atrás do quadro existe um pequeno painel numérico. Os números parecem formar uma sequência relacionada ao número 13.",
    reaction:[
      ["Avylla","Esses números não estão aqui por acaso."],
      ["Anna Laura","Existe um padrão. Precisamos descobrir onde ele leva."],
      ["Cibelly","Espero que essa matemática toda leve a algum lugar."]
    ],
    actions:["Resolver a sequência numérica","Procurar outra pista no painel"]
  },
  geografia:{
    title:"MAPA ANTIGO",
    description:"Anny encontra um mapa antigo. Uma parte da escola foi modificada e fechada há muitos anos.",
    reaction:[
      ["Anny","Eu já vi esse mapa antes..."],
      ["Anny","Essa parte antiga da escola foi fechada há muitos anos."],
      ["Costa","Então talvez a Sala 13 esteja nessa parte antiga."]
    ],
    actions:["Examinar a área fechada","Comparar o mapa com a escola atual"]
  },
  cantina:{
    title:"A CAIXA",
    description:"Dentro de uma caixa antiga existe um papel dobrado. Nele há apenas um número: 13.",
    reaction:[
      ["João Felipe","Tem um papel aqui... e eu quase deixei passar."],
      ["Camylle","O número 13 aparece de novo."],
      ["Lucca","PARAA! Esse número está literalmente perseguindo a gente."]
    ],
    actions:["Examinar o papel encontrado","Procurar outros objetos na caixa"]
  },
  quadra:{
    title:"A PORTA",
    description:"Perto da quadra existe uma porta antiga que não aparece nos mapas atuais.",
    reaction:[
      ["João Arthur","Essa porta não aparece no mapa."],
      ["Kaio","Talvez seja uma entrada para a parte antiga."],
      ["Rosana","Agora temos uma possível passagem."]
    ],
    actions:["Investigar a porta misteriosa","Procurar pistas antes de entrar"]
  },
  direcao:{
    title:"O CADERNO",
    description:"Na direção existe um caderno antigo com registros de várias turmas. Alguns nomes da turma aparecem nele.",
    reaction:[
      ["Beto","Esse caderno é muito antigo."],
      ["Fernanda","Tem nomes de alunos aqui."],
      ["Cibelly","Por que alguém guardaria isso por tantos anos?"]
    ],
    actions:["Examinar os nomes do caderno","Procurar a data dos registros"]
  }
};

let selectedCharacter=null;
let introIndex=0;
let currentDialogue=0;
let clues=[];
let investigationPoints=0;
let choiceHistory=[];
let currentLocation=null;
let currentPhase="story";
let currentScene="aula";
let returnAction=null;
let pendingLines=[];
let locked=false;

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.toggle("active",s.id===id);
  });
}

function startIntro(){
  introIndex=0;
  showScreen("intro");
  showIntroText();
}

function showIntroText(){
  $("introText").textContent=introTexts[introIndex];
}

function nextIntro(){
  introIndex++;
  if(introIndex>=introTexts.length){
    showCharacterSelection();
  }else{
    showIntroText();
  }
}

function skipIntro(){
  showCharacterSelection();
}

function showCharacterSelection(){
  showScreen("selection");
  const box=$("characters");
  box.replaceChildren();

  characters.forEach(c=>{
    const card=document.createElement("div");
    card.className="character-card";
    card.tabIndex=0;
    card.setAttribute("role","button");
    card.setAttribute("aria-label","Escolher "+c.name);

    const img=document.createElement("img");
    img.src=c.image;
    img.alt=c.name;
    img.loading="lazy";

    const name=document.createElement("div");
    name.className="character-name";
    name.textContent=c.name;

    const trait=document.createElement("div");
    trait.className="character-trait";
    trait.textContent=c.trait;

    const ability=document.createElement("div");
    ability.className="character-trait";
    ability.textContent="Habilidade: "+c.ability;

    card.append(img,name,trait,ability);
    card.dataset.id=c.id;
    card.onclick=()=>selectCharacter(c,card);
    card.onkeydown=e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        selectCharacter(c,card);
      }
    };
    box.appendChild(card);
  });

  $("startButton").disabled=!selectedCharacter;
}

function scrollCharacters(direction){
  const box=$("characters");
  const card=box.querySelector(".character-card");
  const amount=card?card.getBoundingClientRect().width+12:210;
  box.scrollBy({left:direction*amount,behavior:"smooth"});
}

function selectCharacter(character,card){
  selectedCharacter=character;
  document.querySelectorAll(".character-card").forEach(c=>{
    c.classList.toggle("selected",c===card);
  });
  $("startButton").disabled=false;
  card.scrollIntoView({
    behavior:"smooth",block:"nearest",inline:"center"
  });
}

function preparePlayer(){
  if(!selectedCharacter)return false;
  $("hudName").textContent=selectedCharacter.name;
  $("hudAbility").textContent="Habilidade: "+selectedCharacter.ability;
  $("characterSprite").src=selectedCharacter.image;
  updateClueCount();
  return true;
}

function startGame(){
  if(!preparePlayer())return;

  clues=[];
  investigationPoints=0;
  choiceHistory=[];
  currentDialogue=0;
  currentPhase="story";
  currentLocation=null;
  pendingLines=[];
  setScene("aula");
  showScreen("game");
  showStory();
  saveGame();
}

function setScene(scene){
  if(!scenes[scene])return;
  currentScene=scene;
  $("background").src=scenes[scene];
}

function getSpeakerImage(name){
  const c=characters.find(p=>p.name===name);
  return c?c.image:(speakerAssets[name]||"");
}

function setSpeaker(name){
  $("speaker").textContent=name;
  $("speaker").classList.toggle(
    "protagonist",
    !!selectedCharacter&&name===selectedCharacter.name
  );

  const player=$("characterSprite");
  const other=$("speakerSprite");

  player.className="character-sprite hidden-sprite";
  other.className="speaker-sprite hidden-sprite";

  if(name==="Narrador"||name==="Desconhecido")return;

  if(selectedCharacter&&name===selectedCharacter.name){
    player.src=selectedCharacter.image;
    player.className="character-sprite player-center";
    return;
  }

  if(selectedCharacter){
    player.src=selectedCharacter.image;
    player.className="character-sprite";
  }

  const image=getSpeakerImage(name);
  if(image){
    other.src=image;
    other.alt=name;
    other.className="speaker-sprite";
  }
}

function setDialogue(name,text){
  setSpeaker(name);
  $("dialogueText").textContent=text;
  $("dialogueArea").scrollTop=0;
}

function clearChoices(){
  $("choices").replaceChildren();
  $("choices").classList.remove("active");
  $("choiceQuestion").classList.remove("active");
  $("continueButton").hidden=false;
  locked=false;
}

function decision(name,text,options){
  if(options.length!==2){
    throw new Error("Toda decisão precisa ter duas ações.");
  }
  locked=true;
  setDialogue(name,text);
  const box=$("choices");
  box.replaceChildren();
  $("continueButton").hidden=true;
  $("choiceQuestion").classList.add("active");

  options.forEach(([label,action],index)=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="choice";

    const number=document.createElement("span");
    number.className="choice-number";
    number.textContent=index+1;

    const title=document.createElement("span");
    title.textContent=label;

    btn.append(number,title);
    btn.onclick=()=>{
      if(!locked)return;
      locked=false;
      choiceHistory.push({
        phase:currentPhase,
        option:index+1,
        action:label
      });
      clearChoices();
      saveGame();
      action();
    };
    box.appendChild(btn);
  });
  box.classList.add("active");
  $("dialogueArea").scrollTop=0;
}

function narration(name,text,next){
  clearChoices();
  setDialogue(name,text);
  returnAction=next;
  saveGame();
}

function showStory(){
  currentPhase="story";
  if(currentDialogue>=story.length){
    showInvestigationMenu();
    return;
  }
  const line=story[currentDialogue];
  narration(line[0],line[1],()=>{
    currentDialogue++;
    showStory();
  });
}

function advanceDialogue(){
  if(locked||$("clueModal").classList.contains("active"))return;
  if(!$("game").classList.contains("active"))return;
  const next=returnAction;
  returnAction=null;
  if(typeof next==="function")next();
}

function updateClueCount(){
  $("clueCount").textContent=clues.length+" / 7";
}

function queueLines(lines,after){
  pendingLines=lines.slice();
  function next(){
    if(!pendingLines.length){
      after();
      return;
    }
    const [name,text]=pendingLines.shift();
    narration(name,text,next);
  }
  next();
}

function availableLocations(){
  return locations.filter(loc=>!clues.includes(loc.id));
}

function showInvestigationMenu(){
  currentPhase="investigation";

  if(clues.length>=3){
    decision("Narrador",
      "As pistas começam a formar uma imagem. Agora a turma precisa decidir o próximo passo.",
      [
        ["Continuar procurando pistas",showLocationPair],
        ["Investigar a passagem para a Sala 13",showAdvisors]
      ]
    );
    return;
  }
  showLocationPair();
}

function showLocationPair(){
  currentPhase="locations";
  const remaining=availableLocations();

  if(remaining.length===0){
    showAdvisors();
    return;
  }

  if(remaining.length===1){
    decision("Narrador",
      "Resta uma área da escola para investigar.",
      [
        ["Investigar "+remaining[0].name,()=>investigate(remaining[0])],
        ["Seguir as pistas reunidas",showAdvisors]
      ]
    );
    return;
  }

  showLocationAt(0);
}

function showLocationAt(index){
  currentPhase="locations";
  const remaining=availableLocations();

  if(index>=remaining.length){
    if(clues.length>=3)showAdvisors();
    else showLocationAt(0);
    return;
  }

  const first=remaining[index];
  const second=remaining[index+1];

  if(!second){
    decision("Narrador","Qual será o próximo passo?",
      [
        ["Investigar "+first.name,()=>investigate(first)],
        ["Rever as áreas disponíveis",()=>showLocationAt(0)]
      ]
    );
    return;
  }

  decision("Narrador",
    "A turma precisa decidir qual local investigar.",
    [
      ["Investigar "+first.name,()=>investigate(first)],
      ["Investigar "+second.name,()=>investigate(second)]
    ]
  );
}

function investigate(location){
  if(clues.includes(location.id)){
    showInvestigationMenu();
    return;
  }

  currentLocation=location.id;
  currentPhase="clue";
  setScene(location.id);

  clues.push(location.id);
  investigationPoints+=2;
  updateClueCount();
  saveGame();

  const clue=clueData[location.id];
  $("clueTitle").textContent=clue.title;
  $("clueDescription").textContent=clue.description;
  $("clueModal").classList.add("active");
}

function closeClue(){
  $("clueModal").classList.remove("active");
  showInvestigationReaction();
}

function showInvestigationReaction(){
  const clue=clueData[currentLocation];
  const lines=clue.reaction;

  queueLines([lines[0]],()=>{
    currentPhase="reaction";
    decision(lines[0][0],lines[0][1],[
      [clue.actions[0],()=>{
        investigationPoints++;
        queueLines([lines[1]],showInvestigationMenu);
      }],
      [clue.actions[1],()=>{
        investigationPoints++;
        queueLines([lines[2]],showInvestigationMenu);
      }]
    ]);
  });
}

function showAdvisors(){
  currentPhase="advisors";
  decision("Narrador",
    "A turma reuniu informações sobre a Sala 13. O que fazer agora?",
    [
      ["Conversar com os professores",chooseAdvisor],
      ["Procurar a Sala 13",goToRoom13]
    ]
  );
}

function chooseAdvisor(){
  currentPhase="advisor-choice";
  decision("Narrador","Qual informação devemos investigar primeiro?",[
    ["Investigar os mapas com Anny",talkAnny],
    ["Consultar Beto e Mara",chooseBetoMara]
  ]);
}

function chooseBetoMara(){
  decision("Narrador","Quem pode ajudar a turma agora?",[
    ["Conversar com Beto",talkBeto],
    ["Analisar o sistema com Mara",talkMara]
  ]);
}

function talkAnny(){
  currentPhase="anny";
  setScene("geografia");
  queueLines([
    ["Anny","Eu já vi esse mapa antes... essa parte antiga da escola foi fechada há muitos anos."],
    ["Anny","Eu não sei toda a história. Mas lembro que existia uma sala naquela área."]
  ],()=>{
    decision("Narrador","A conversa revelou novas informações.",[
      ["Procurar a sala mencionada por Anny",goToRoom13],
      ["Investigar outras pistas",showInvestigationMenu]
    ]);
  });
}

function talkBeto(){
  currentPhase="beto";
  setScene("matematica");
  queueLines([
    ["Beto","Eu disse que a Sala 13 não existe... mas talvez eu tenha sido rápido demais ao dizer isso."],
    ["Beto","Eu sabia que havia uma parte antiga da escola. O que eu não sabia era que ela ainda poderia estar acessível."]
  ],()=>{
    decision("Narrador","Beto confirmou a existência da área antiga.",[
      ["Procurar a parte antiga da escola",goToRoom13],
      ["Continuar investigando",showInvestigationMenu]
    ]);
  });
}

function talkMara(){
  currentPhase="mara";
  setScene("robotica");
  queueLines([
    ["Mara","O sistema não travou sozinho. Existe um comando externo registrado."],
    ["Mara","13:13. Exatamente no momento em que o relógio parou."]
  ],()=>{
    investigationPoints+=3;
    saveGame();
    decision("Narrador","Os registros confirmam que o bloqueio foi provocado.",[
      ["Seguir os registros até a Sala 13",goToRoom13],
      ["Reunir mais informações",showInvestigationMenu]
    ]);
  });
}

function goToRoom13(){
  currentPhase="room-door";
  setScene("sala-13");
  decision("Narrador",
    "Seguindo as pistas, a turma encontra uma passagem escondida. No fim dela existe uma porta antiga.",
    [
      ["Abrir a porta misteriosa",openRoom13],
      ["Investigar a porta primeiro",investigateDoor]
    ]
  );
}

function investigateDoor(){
  currentPhase="door";
  decision("Rosana",
    "Tem marcas antigas aqui. E olhem... existe um número quase apagado.",
    [
      ["Examinar o número 13 e abrir a porta",openRoom13],
      ["Voltar e avaliar a entrada",goToRoom13]
    ]
  );
}

function openRoom13(){
  currentPhase="room-inside";
  setScene("sala-13");
  decision("Narrador",
    "A porta se abre lentamente. A turma entra na sala que oficialmente não existe.",
    [
      ["Procurar documentos antigos",searchDocuments],
      ["Investigar o computador",searchComputer]
    ]
  );
}

function searchDocuments(){
  currentPhase="documents";
  queueLines([
    ["Fernanda","Encontrei uma caixa cheia de documentos antigos."],
    ["Rosana","Aqui está... registros da escola, plantas antigas e informações sobre a Sala 13."]
  ],()=>{
    investigationPoints+=5;
    decision("Narrador","Os documentos revelam o passado da sala.",[
      ["Continuar lendo e descobrir a verdade",resolveEnding],
      ["Examinar também o computador",searchComputer]
    ]);
  });
}

function searchComputer(){
  currentPhase="computer";
  queueLines([
    ["Mara","Esse computador ainda funciona."],
    ["Mara","Existe um registro do sistema. A Sala 13 foi removida dos mapas depois de uma reforma."],
    ["Mara","O último comando foi enviado às 13:13. Alguém queria que vocês encontrassem esta sala."]
  ],()=>{
    investigationPoints+=5;
    decision("Narrador","Os registros mostram o motivo do bloqueio.",[
      ["Descobrir a verdade",resolveEnding],
      ["Examinar os documentos da sala",searchDocuments]
    ]);
  });
}

function resolveEnding(){
  if(clues.length===7&&investigationPoints>=19){
    secretEnding();
  }else{
    trueEnding();
  }
}

function renderEnding(title,text){
  localStorage.removeItem("sala13_save");
  $("endingTitle").textContent=title;
  $("endingText").textContent=text;
  showScreen("ending");
}

function trueEnding(){
  renderEnding(
    "A VERDADE",
    "A turma finalmente descobre o segredo da Sala 13. A sala existia na antiga estrutura da escola e foi retirada dos mapas durante uma reforma. Os registros mostram que o sistema foi ativado às 13:13 de propósito. Alguém queria que vocês encontrassem aquele lugar. Mas a maior pergunta permanece: quem enviou a mensagem? Talvez esse seja o próximo mistério."
  );
}

function escapeEnding(){
  renderEnding(
    "A FUGA",
    "A turma decide não continuar. Depois de algum tempo, as portas da escola são liberadas e todos conseguem ir embora. Mas ninguém consegue esquecer a mensagem: ENCONTREM A SALA 13. Talvez vocês tenham escapado... mas o mistério continua."
  );
}

function secretEnding(){
  renderEnding(
    "O SEGREDO DA SALA 13",
    "Vocês descobriram todos os detalhes escondidos. A Sala 13 não era apenas uma sala esquecida. Ela fazia parte de um antigo projeto da escola e os registros indicam que alguém ainda acompanha o sistema. Antes que vocês possam descobrir quem é, uma última mensagem aparece no computador: 'VOCÊS NÃO DEVERIAM TER CHEGADO TÃO LONGE.'"
  );
}

function saveGame(){
  if(!selectedCharacter)return;
  try{
    localStorage.setItem("sala13_save",JSON.stringify({
      version:2,
      character:selectedCharacter.id,
      clues,
      points:investigationPoints,
      choices:choiceHistory,
      dialogue:currentDialogue,
      phase:currentPhase,
      scene:currentScene,
      location:currentLocation
    }));
  }catch(e){
    console.warn("Não foi possível salvar o jogo.",e);
  }
}

function continueGame(){
  let data;
  try{
    data=JSON.parse(localStorage.getItem("sala13_save"));
  }catch(e){
    alert("O salvamento está corrompido.");
    return;
  }

  if(!data){
    alert("Ainda não existe um jogo salvo.");
    return;
  }

  selectedCharacter=characters.find(c=>c.id===data.character);
  if(!selectedCharacter){
    alert("Personagem não encontrado.");
    return;
  }

  clues=Array.isArray(data.clues)?data.clues:[];
  investigationPoints=Number(data.points)||0;
  choiceHistory=Array.isArray(data.choices)?data.choices:[];
  currentDialogue=Number(data.dialogue)||0;
  currentPhase=data.phase||"story";
  currentLocation=data.location||null;

  preparePlayer();
  setScene(data.scene||"aula");
  showScreen("game");

  switch(currentPhase){
    case "story":showStory();break;
    case "locations":showLocationPair();break;
    case "investigation":showInvestigationMenu();break;
    case "advisors":showAdvisors();break;
    case "advisor-choice":chooseAdvisor();break;
    case "anny":talkAnny();break;
    case "beto":talkBeto();break;
    case "mara":talkMara();break;
    case "room-door":goToRoom13();break;
    case "door":investigateDoor();break;
    case "room-inside":openRoom13();break;
    case "documents":searchDocuments();break;
    case "computer":searchComputer();break;
    default:showInvestigationMenu();
  }
}

function restartGame(){
  localStorage.removeItem("sala13_save");
  selectedCharacter=null;
  clues=[];
  investigationPoints=0;
  choiceHistory=[];
  currentDialogue=0;
  showScreen("menu");
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("clueModal").classList.contains("active")){
    return;
  }

  if(
    (e.key==="Enter"||e.key===" ") &&
    $("game").classList.contains("active") &&
    !locked &&
    !e.target.closest("button")
  ){
    e.preventDefault();
    advanceDialogue();
  }
});

window.addEventListener("resize",()=>{
  const area=$("dialogueArea");
  if(area)area.scrollTop=Math.min(area.scrollTop,area.scrollHeight);
});

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"&&
     $("game").classList.contains("active")){
    saveGame();
  }
});

</script>
