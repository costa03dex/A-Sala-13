<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A SALA 13</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#080808;
    color:#f1f1f1;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

button{
    font-family:inherit;
}

/* =====================================================
   TELAS
===================================================== */

.screen{
    position:fixed;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}

/* =====================================================
   MENU
===================================================== */

#menu{
    align-items:center;
    justify-content:center;
    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #383838 0%,
            #181818 35%,
            #070707 75%
        );
}

.menu-box{
    width:min(800px,90%);
}

.logo{
    font-size:clamp(45px,9vw,95px);
    font-weight:900;
    letter-spacing:9px;

    color:#eeeeee;

    text-shadow:
        0 0 10px #777,
        0 0 30px #333;

    margin-bottom:15px;
}

.subtitle{
    color:#aaa;
    font-size:18px;
    margin-bottom:45px;
}

.menu-button{
    display:block;

    width:310px;
    max-width:100%;

    margin:14px auto;

    padding:17px;

    background:#222;
    color:white;

    border:1px solid #777;
    border-radius:8px;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.menu-button:hover{
    background:#3a3a3a;
    border-color:#aaa;

    transform:translateY(-2px);

    box-shadow:
        0 0 20px rgba(255,255,255,.15);
}

/* =====================================================
   INTRO
===================================================== */

#intro{
    align-items:center;
    justify-content:center;

    background:#050505;
}

.intro-box{
    width:min(900px,90%);
    text-align:center;
}

.intro-text{
    min-height:180px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(22px,4vw,38px);

    line-height:1.4;

    font-weight:bold;

    color:#eee;

    animation:fadeText .5s;
}

@keyframes fadeText{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.intro-controls{
    display:flex;
    justify-content:center;

    gap:12px;

    margin-top:35px;

    flex-wrap:wrap;
}

.small-button{
    padding:12px 23px;

    background:#1c1c1c;

    border:1px solid #666;

    border-radius:7px;

    color:white;

    cursor:pointer;
}

.small-button:hover{
    background:#333;
}

/* =====================================================
   SELEÇÃO
===================================================== */

#selection{
    overflow:auto;

    padding:40px 20px;

    justify-content:center;

    background:
        radial-gradient(
            circle at top,
            #292929,
            #080808 70%
        );
}

.selection-box{
    width:min(1150px,100%);

    text-align:center;
}

.selection-title{
    font-size:40px;

    margin-bottom:8px;
}

.selection-description{
    color:#aaa;

    margin-bottom:30px;
}

.character-carousel{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    margin:10px auto 0;
}

.characters{
    display:flex;
    gap:18px;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    scroll-snap-type:x mandatory;
    overscroll-behavior-x:contain;
    padding:18px 10px 24px;
    flex:1;
    min-width:0;
    scrollbar-width:thin;
    scrollbar-color:#777 #151515;
    -webkit-overflow-scrolling:touch;
    cursor:grab;
}

.characters:active{ cursor:grabbing; }

.characters::-webkit-scrollbar{ height:9px; }
.characters::-webkit-scrollbar-track{
    background:#151515;
    border-radius:20px;
}
.characters::-webkit-scrollbar-thumb{
    background:#666;
    border-radius:20px;
}

.character-card{
    flex:0 0 245px;
    min-height:365px;
    background:#151515;
    border:1px solid #3f3f3f;
    border-radius:12px;
    padding:18px;
    cursor:pointer;
    transition:.2s;
    scroll-snap-align:center;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    user-select:none;
}

.character-card:hover{
    transform:translateY(-5px);
    border-color:#999;
    background:#222;
    box-shadow:0 0 20px rgba(255,255,255,.1);
}

.character-card.selected{
    background:#303030;
    border-color:#eee;
    box-shadow:
        0 0 0 2px rgba(255,255,255,.15),
        0 0 30px rgba(255,255,255,.2);
    transform:translateY(-4px);
}

.character-card.selected::after{
    content:"✓ SELECIONADO";
    display:block;
    margin-top:12px;
    color:#fff;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.character-card img{
    width:100%;
    height:235px;
    object-fit:contain;
    display:block;
    pointer-events:none;
}

.character-carousel-arrow{
    flex:0 0 52px;
    width:52px;
    height:52px;
    border:1px solid #666;
    border-radius:50%;
    background:#181818;
    color:#fff;
    font-size:28px;
    line-height:1;
    cursor:pointer;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
}

.character-carousel-arrow:hover{
    background:#333;
    border-color:#aaa;
    transform:scale(1.06);
}

.character-carousel-arrow:active{ transform:scale(.96); }

.character-carousel-hint{
    margin-top:2px;
    color:#777;
    font-size:12px;
}

.character-name{

    font-size:17px;

    font-weight:bold;

    margin-top:8px;
}

.character-trait{

    color:#aaa;

    font-size:12px;

    margin-top:5px;

    line-height:1.3;
}

.start-game{

    margin-top:30px;

    padding:15px 35px;

    background:#dedede;

    color:#111;

    border:0;

    border-radius:8px;

    font-weight:bold;

    font-size:17px;

    cursor:pointer;

    transition:.2s;
}

.start-game:hover{
    background:white;
}

.start-game:disabled{

    opacity:.35;

    cursor:not-allowed;
}

/* =====================================================
   JOGO
===================================================== */

#game{

    flex-direction:column;

    background:#000;
}

.game-scene{

    position:relative;

    flex:1;

    min-height:0;

    overflow:hidden;
}

#background{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;
}

/*
   IMPORTANTE:
   Não usamos grayscale.
   Os personagens e cenários continuam coloridos.
*/

.scene-dark{

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.08),
            rgba(0,0,0,.15) 45%,
            rgba(0,0,0,.78)
        );

    pointer-events:none;
}

/* =====================================================
   PERSONAGEM
===================================================== */

.character-sprite,
.speaker-sprite{

    position:absolute;

    bottom:0;

    height:min(68%,590px);

    max-width:34%;

    object-fit:contain;

    object-position:bottom center;

    filter:
        drop-shadow(
            0 12px 18px
            rgba(0,0,0,.75)
        );

    transition:
        left .35s ease,
        right .35s ease,
        transform .35s ease,
        opacity .25s ease,
        filter .25s ease;

    z-index:3;

    pointer-events:none;
}

/* Personagem escolhido pelo jogador: fica à esquerda
   quando outra pessoa está falando. */
.character-sprite{

    left:8%;

    transform:translateX(-50%);

    opacity:1;
}

/* Outro personagem que está falando: fica à direita. */
.speaker-sprite{

    right:8%;

    transform:translateX(50%);

    opacity:1;
}

/* Quando o próprio jogador fala, ele ocupa o centro
   e o segundo personagem desaparece. */
.character-sprite.player-center{

    left:50%;

    height:min(84%,720px);

    max-width:45%;

    transform:translateX(-50%) scale(1.04);

    z-index:4;
}

.speaker-sprite.hidden-sprite,
.character-sprite.hidden-sprite{

    opacity:0;

    visibility:hidden;
}

.character-sprite.talking,
.speaker-sprite.talking{

    filter:
        drop-shadow(
            0 14px 22px
            rgba(0,0,0,.85)
        );
}

.character-sprite.player-center.talking{

    transform:translateX(-50%) scale(1.07);
}

.speaker-sprite.talking{

    transform:translateX(50%) scale(1.025);
}

/* =====================================================
   HUD
===================================================== */

.hud{

    position:absolute;

    top:15px;

    left:15px;

    right:15px;

    z-index:5;

    display:flex;

    justify-content:space-between;

    align-items:center;

    pointer-events:none;
}

.hud-box{

    background:
        rgba(10,10,10,.85);

    border:
        1px solid #555;

    padding:
        9px 14px;

    border-radius:7px;

    backdrop-filter:blur(6px);
}

.hud-name{
    font-weight:bold;
}

.hud-sub{
    color:#aaa;
    font-size:12px;
    margin-top:3px;
}

.hud-clues{
    color:#ccc;
    font-size:13px;
}

/* =====================================================
   DIÁLOGO
===================================================== */

.dialogue-area{

    position:relative;

    z-index:10;

    background:
        linear-gradient(
            to bottom,
            rgba(5,5,5,.15),
            rgba(5,5,5,.97) 20%
        );

    padding:
        25px 5% 20px;
}

.dialogue-box{

    max-width:1100px;

    margin:auto;

    position:relative;
}

.speaker{

    display:inline-block;

    background:#333;

    border:
        1px solid #666;

    border-bottom:0;

    padding:
        8px 18px;

    border-radius:
        7px 7px 0 0;

    font-weight:bold;

    min-width:120px;

    color:#fff;
}

.speaker.protagonist{

    background:#555;

    border-color:#aaa;
}

.dialogue-text{

    min-height:90px;

    padding:20px;

    background:
        rgba(17,17,17,.98);

    border:
        1px solid #555;

    border-radius:
        0 9px 9px 9px;

    font-size:18px;

    line-height:1.5;

    cursor:pointer;
}

.continue-hint{

    text-align:right;

    color:#777;

    font-size:12px;

    margin-top:7px;
}

/* =====================================================
   ESCOLHAS
===================================================== */

.choices{

    display:none;

    max-width:1000px;

    margin:
        12px auto 0;

    gap:10px;

    flex-wrap:wrap;
}

.choice{

    flex:1;

    min-width:220px;

    padding:14px;

    background:#181818;

    border:
        1px solid #555;

    color:white;

    border-radius:8px;

    cursor:pointer;

    text-align:left;

    transition:.2s;
}

.choice:hover{

    background:#333;

    border-color:#aaa;

    transform:translateY(-2px);
}

.choice.protagonist-choice{

    background:#242424;

    border-color:#888;
}

.choice-number{

    display:inline-flex;

    width:25px;

    height:25px;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:#555;

    margin-right:8px;

    font-weight:bold;
}

/* =====================================================
   MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.8);

    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{

    width:min(650px,100%);

    background:#151515;

    border:
        1px solid #666;

    border-radius:12px;

    padding:25px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.8);
}

.modal-box h2{

    margin-bottom:15px;
}

.modal-box p{

    color:#bbb;

    line-height:1.6;
}

.modal-close{

    margin-top:20px;

    padding:10px 20px;

    background:#ddd;

    color:#111;

    border:0;

    border-radius:7px;

    cursor:pointer;

    font-weight:bold;
}

/* =====================================================
   FINAL
===================================================== */

#ending{

    align-items:center;

    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            #303030,
            #080808 70%
        );

    padding:30px;
}

.ending-box{

    max-width:800px;
}

.ending-title{

    font-size:
        clamp(35px,7vw,70px);

    font-weight:900;

    margin-bottom:20px;
}

.ending-text{

    color:#ccc;

    line-height:1.7;

    font-size:18px;
}

.ending-button{

    margin-top:30px;

    padding:14px 28px;

    background:#ddd;

    color:#111;

    border:0;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px){

    .logo{
        letter-spacing:3px;
    }
    .character-sprite,
    .speaker-sprite{

        height:54%;

        max-width:43%;
    }

    .character-sprite{
        left:18%;
    }

    .speaker-sprite{
        right:18%;
    }

    .character-sprite.player-center{

        left:50%;

        height:67%;

        max-width:62%;

        transform:translateX(-50%) scale(1.02);
    }

    .character-sprite.player-center.talking{
        transform:translateX(-50%) scale(1.05);
    }

    .dialogue-area{

        padding:15px;
    }

    .dialogue-text{

        font-size:15px;

        min-height:100px;
    }

    .character-carousel{
        gap:7px;
    }

    .characters{
        gap:12px;
        padding:12px 6px 18px;
    }

    .character-card{
        flex-basis:210px;
        min-height:330px;
        padding:15px;
    }

    .character-card img{
        height:205px;
    }

    .character-carousel-arrow{
        flex-basis:42px;
        width:42px;
        height:42px;
        font-size:22px;
    }

    .character-carousel-hint{
        font-size:11px;
    }

    .choice{

        min-width:100%;
    }
}

</style>
</head>

<body>


<!-- =====================================================
     MENU
===================================================== -->

<section id="menu" class="screen active">

    <div class="menu-box">

        <div class="logo">
            A SALA 13
        </div>

        <div class="subtitle">
            Um mistério escolar onde nada é o que parece.
        </div>

        <button
            class="menu-button"
            onclick="startIntro()">

            COMEÇAR

        </button>

        <button
            class="menu-button"
            onclick="continueGame()">

            CONTINUAR

        </button>

    </div>

</section>


<!-- =====================================================
     INTRO
===================================================== -->

<section id="intro" class="screen">

    <div class="intro-box">

        <div
            id="introText"
            class="intro-text">
        </div>

        <div class="intro-controls">

            <button
                class="small-button"
                onclick="nextIntro()">

                CONTINUAR

            </button>

            <button
                class="small-button"
                onclick="skipIntro()">

                PULAR INTRO

            </button>

        </div>

    </div>

</section>


<!-- =====================================================
     SELEÇÃO DE PERSONAGEM
===================================================== -->

<section id="selection" class="screen">

    <div class="selection-box">

        <h1 class="selection-title">
            Escolha seu personagem
        </h1>

        <p class="selection-description">
            Você controlará esse personagem durante toda a história.
        </p>

        <div class="character-carousel">
            <button
                class="character-carousel-arrow"
                type="button"
                aria-label="Personagem anterior"
                onclick="scrollCharacters(-1)">
                ←
            </button>

            <div
                id="characters"
                class="characters">
            </div>

            <button
                class="character-carousel-arrow"
                type="button"
                aria-label="Próximo personagem"
                onclick="scrollCharacters(1)">
                →
            </button>
        </div>

        <div class="character-carousel-hint">
            Arraste para os lados ou use as setas para escolher.
        </div>

        <button
            id="startButton"
            class="start-game"
            disabled
            onclick="startGame()">

            ENTRAR NA HISTÓRIA

        </button>

    </div>

</section>


<!-- =====================================================
     JOGO
===================================================== -->

<section id="game" class="screen">

    <div class="game-scene">

        <img
            id="background"
            src="sala-aula.png"
            alt="Cenário">

        <div class="scene-dark"></div>


        <div class="hud">

            <div class="hud-box">

                <div
                    id="hudName"
                    class="hud-name">
                    -
                </div>

                <div
                    id="hudAbility"
                    class="hud-sub">
                    -
                </div>

            </div>

            <div class="hud-box">

                <div class="hud-clues">
                    PISTAS
                </div>

                <div id="clueCount">
                    0 / 3
                </div>

            </div>

        </div>


        <!-- Sprite do jogador/protagonista -->
        <img
            id="characterSprite"
            class="character-sprite hidden-sprite"
            src=""
            alt="Personagem do jogador">

        <!-- Sprite de quem está falando -->
        <img
            id="speakerSprite"
            class="speaker-sprite hidden-sprite"
            src=""
            alt="Personagem falando">

    </div>


    <div class="dialogue-area">

        <div class="dialogue-box">

            <div
                id="speaker"
                class="speaker">

                Narrador

            </div>

            <div
                id="dialogueText"
                class="dialogue-text"
                onclick="advanceDialogue()">
            </div>

            <div class="continue-hint">
                Clique na caixa para continuar
            </div>

            <div
                id="choices"
                class="choices">
            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     FINAL
===================================================== -->

<section id="ending" class="screen">

    <div class="ending-box">

        <div
            id="endingTitle"
            class="ending-title">
            -
        </div>

        <p
            id="endingText"
            class="ending-text">
            -
        </p>

        <button
            class="ending-button"
            onclick="restartGame()">

            JOGAR NOVAMENTE

        </button>

    </div>

</section>


<!-- =====================================================
     MODAL DE PISTA
===================================================== -->

<div
    id="clueModal"
    class="modal">

    <div class="modal-box">

        <h2 id="clueTitle">
            Pista encontrada
        </h2>

        <p id="clueDescription">
            -
        </p>

        <button
            class="modal-close"
            onclick="closeClue()">

            CONTINUAR

        </button>

    </div>

</div>


<script>

/* =====================================================
   PERSONAGENS
===================================================== */

const characters = [

    {
        id:"cibelly",
        name:"Cibelly",
        image:"cibelly.png",
        trait:"Engraçada, descontraída e tranquila.",
        ability:"Descontração"
    },

    {
        id:"fernanda",
        name:"Fernanda",
        image:"fernanda.png",
        trait:"Quieta, educada, engraçada e observadora.",
        ability:"Observação Silenciosa"
    },

    {
        id:"rosana",
        name:"Rosana",
        image:"rosana.png",
        trait:"Gótica, nerd e apaixonada por animes e K-pop.",
        ability:"Investigação"
    },

    {
        id:"anna-laura",
        name:"Anna Laura",
        image:"anna-laura.png",
        trait:"Educada, inteligente e muito nerd.",
        ability:"Lógica"
    },

    {
        id:"camylle",
        name:"Camylle",
        image:"camylle.png",
        trait:"Simpática, educada e fã de K-pop.",
        ability:"Empatia"
    },

    {
        id:"avylla",
        name:"Avylla",
        image:"avylla.png",
        trait:"Ama matemática, livros e é muito engraçada.",
        ability:"Matemática"
    },

    {
        id:"costa",
        name:"Costa",
        image:"costa.png",
        trait:"Cristã, engraçada e apaixonada por música.",
        ability:"Música"
    },

    {
        id:"joao-arthur",
        name:"João Arthur",
        image:"joao-arthur.png",
        trait:"Gente boa, engraçado e fã de basquete e futebol.",
        ability:"Atletismo"
    },

    {
        id:"kaio",
        name:"Kaio",
        image:"kaio.png",
        trait:"Engraçado, gente boa e fã de Neymar e handebol.",
        ability:"Reflexo"
    },

    {
        id:"joao-felipe",
        name:"João Felipe",
        image:"joao-felipe.png",
        trait:"Sonolento, engraçado e gente boa.",
        ability:"Modo Soneca"
    },

    {
        id:"lucca",
        name:"Lucca",
        image:"lucca.png",
        trait:"Engraçado e especialista em performances.",
        ability:"Performance"
    }

];


/* =====================================================
   ESTADO DO JOGO
===================================================== */

let selectedCharacter = null;

/* Sprites dos personagens que aparecem nas falas, mas não estão
   na lista jogável principal. */
const speakerAssets = {
    "Beto":"beto.png",
    "Derson":"douglas.png",
    "Mara":"mara.png",
    "Anny":"anny.png"
};

let currentDialogue = 0;

let dialogueMode = "story";

let clues = [];

let investigationPoints = 0;

let choiceHistory = [];

let currentInvestigationLocation = null;

let afterClueAction = null;


/* =====================================================
   INTRO
===================================================== */

const introTexts = [

    "Tudo começou em uma sexta-feira aparentemente normal...",

    "Era o último período. A turma só queria ir embora.",

    "Até que o sinal tocou.",

    "Mas quando os alunos tentaram sair...",

function showCharacterSelection(){

            document.createElement("div");

            </div>

            selectCharacter(

        container.appendChild(card);

    });

    if(selectedCharacter){

        const selectedCard =
            container.querySelector(
                `[data-character-id="${selectedCharacter.id}"]`
            );

            selectedCard.classList.add("selected");
            requestAnimationFrame(() => {
                selectedCard.scrollIntoView({
                    behavior:"smooth",
                    block:"nearest",
                    inline:"center"
                });
            });
        }
    }

}


function scrollCharacters(direction){

    const container =
        document.getElementById("characters");

    if(!container)
        return;

    const firstCard =
        container.querySelector(".character-card");

    const amount =
        firstCard
        ? firstCard.getBoundingClientRect().width + 18
        : 270;

    container.scrollBy({
        left: direction * amount,
        behavior:"smooth"
    });
}


/* Arrastar o carrossel com o mouse no computador. */
(function enableCharacterDrag(){

    const container =
        document.getElementById("characters");

    if(!container)
        return;

    let isDown = false;
    let startX = 0;
    let startScroll = 0;

    container.addEventListener("pointerdown", event => {

        if(event.pointerType !== "mouse")
            return;

        isDown = true;
        startX = event.clientX;
        startScroll = container.scrollLeft;

        container.setPointerCapture(event.pointerId);
    });

    container.addEventListener("pointermove", event => {

        if(!isDown)
            return;

        const distance =
            event.clientX - startX;

        if(Math.abs(distance) > 4)
            event.preventDefault();

        container.scrollLeft =
            startScroll - distance;
    });

    container.addEventListener("pointerup", event => {

        isDown = false;

        if(container.hasPointerCapture(event.pointerId))
            container.releasePointerCapture(event.pointerId);
    });

    container.addEventListener("pointercancel", () => {
        isDown = false;
    });

})();


function selectCharacter(character,card){

    selectedCharacter =
        character;

    document
        .querySelectorAll(".character-card")
        .forEach(card =>
            card.classList.remove("selected")
        );

    card.classList.add("selected");

    card.scrollIntoView({
        behavior:"smooth",
        block:"nearest",
        inline:"center"
    });

    document
        .getElementById("startButton")
        .disabled = false;
}

function saveGame(){

    if(!selectedCharacter)
        return;

    localStorage.setItem(
        "sala13_save",
        JSON.stringify({

            character:
                selectedCharacter.id,

            clues:
                clues,

            points:
                investigationPoints,

            choices:
                choiceHistory

        })
    );

}


/* =====================================================
   CONTINUAR
===================================================== */

function continueGame(){

    const saved =
        localStorage.getItem("sala13_save");

    if(!saved){

        alert(
            "Ainda não existe um jogo salvo."
        );

        return;
    }

    try{

        const data =
            JSON.parse(saved);

        selectedCharacter =
            characters.find(
                character =>
                    character.id ===
                    data.character
            );

        if(!selectedCharacter){

            alert(
                "Personagem não encontrado."
            );

            return;
        }

        clues =
            data.clues || [];

        investigationPoints =
            data.points || 0;

        choiceHistory =
            data.choices || [];

        showScreen("game");

        document
            .getElementById("hudName")
            .textContent =
            selectedCharacter.name;

        document
            .getElementById("hudAbility")
            .textContent =
            "Habilidade: " +
            selectedCharacter.ability;

        document
            .getElementById("characterSprite")
            .src =
            selectedCharacter.image;

        updateClueCount();

        setScene("aula");

        startStory();

    }catch(error){

        alert(
            "O salvamento está corrompido."
        );

    }

}

function investigate(location){

    setScene(
        location.scene
    );

    if(
        clues.includes(
            location.clue
        )
    ){

        setDialogue(
            "Narrador",
            "Vocês já investigaram esse lugar. Talvez seja melhor procurar outra pista."
        );

        showMainInvestigation();

        return;
    }

    clues.push(
        location.clue
    );

    investigationPoints += 2;

    currentInvestigationLocation =
        location;

    saveGame();

    updateClueCount();

    showClue(
        clueData[
            location.clue
        ].title,

        clueData[
            location.clue
        ].description
    );

}

/* =====================================================
   DIÁLOGO
===================================================== */

function getSpeakerImage(name){

    if(
        !name ||
        name === "Narrador" ||
        name === "Desconhecido"
    )
        return "";

    const character =
        characters.find(
            character =>
                character.name === name
        );

    if(character)
        return character.image;

    return speakerAssets[name] || "";
}


/* =====================================================
   SISTEMA DINÂMICO DE POSIÇÃO DOS PERSONAGENS
===================================================== */

function setSpeaker(name){

    const speaker =
        document.getElementById("speaker");

    const playerSprite =
        document.getElementById("characterSprite");

    const speakingSprite =
        document.getElementById("speakerSprite");

    const isPlayer =
        !!(
            selectedCharacter &&
            name === selectedCharacter.name
        );

    speaker.textContent = name;

    if(isPlayer){

        speaker.classList.add("protagonist");

    }else{

        speaker.classList.remove("protagonist");
    }

    /* Narrador / desconhecido:
       não colocamos sprites genéricos. */
    if(
        !name ||
        name === "Narrador" ||
        name === "Desconhecido"
    ){

        playerSprite.classList.add("hidden-sprite");
        playerSprite.classList.remove("player-center","talking");

        speakingSprite.classList.add("hidden-sprite");
        speakingSprite.classList.remove("talking");

        playerSprite.removeAttribute("src");
        speakingSprite.removeAttribute("src");

        return;
    }

    /* =================================================
       O JOGADOR ESTÁ FALANDO
       -> somente ele no centro
    ================================================== */

    if(isPlayer){

        playerSprite.src =
            selectedCharacter.image;

        playerSprite.alt =
            selectedCharacter.name;

        playerSprite.classList.remove("hidden-sprite");
        playerSprite.classList.add("player-center");

        speakingSprite.classList.add("hidden-sprite");
        speakingSprite.classList.remove("talking");
        speakingSprite.removeAttribute("src");

        requestAnimationFrame(() => {

            playerSprite.classList.add("talking");

            setTimeout(() => {

                playerSprite.classList.remove("talking");

            },300);

        });

        return;
    }

    /* =================================================
       OUTRA PESSOA ESTÁ FALANDO
       -> jogador à esquerda
       -> pessoa falando à direita
    ================================================== */

    if(selectedCharacter){

        playerSprite.src =
            selectedCharacter.image;

        playerSprite.alt =
            selectedCharacter.name;

        playerSprite.classList.remove(
            "hidden-sprite",
            "player-center"
        );
    }else{

        playerSprite.classList.add(
            "hidden-sprite"
        );
    }

    const image =
        getSpeakerImage(name);

    if(image){

        speakingSprite.src = image;
        speakingSprite.alt = name;
        speakingSprite.classList.remove(
            "hidden-sprite"
        );

        requestAnimationFrame(() => {

            speakingSprite.classList.add(
                "talking"
            );

            setTimeout(() => {

                speakingSprite.classList.remove(
                    "talking"
                );

            },300);

        });

    }else{

        speakingSprite.removeAttribute("src");
        speakingSprite.alt = "";
        speakingSprite.classList.add(
            "hidden-sprite"
        );
    }
}


function setDialogue(text, optionalText){

    /* Compatibilidade com as chamadas existentes:
       setDialogue("Anny", "fala...") */
    if(optionalText !== undefined){

        setSpeaker(text);
        text = optionalText;
    }

    document
        .getElementById(
            "dialogueText"
        )
        .textContent =
        text;
}


function hideChoices(){

    const choices =
        document.getElementById(
            "choices"
        );

    choices.innerHTML = "";

    choices.style.display =
        "none";
}


function addChoice(text,action){

    const choices =
        document.getElementById(
            "choices"
        );

    const button =
        document.createElement(
            "button"
        );

    button.className =
        "choice";

    button.innerHTML =
        text;

    button.onclick =
        action;

    choices.appendChild(
        button
    );
}

   HUD
===================================================== */

        )

        clues.length +

}


/* =====================================================
   ANIMAÇÃO
===================================================== */

function animateCharacter(){

    const playerSprite =
        document.getElementById(
            "characterSprite"
        );

    const speakingSprite =
        document.getElementById(
            "speakerSprite"
        );

    if(playerSprite &&
       !playerSprite.classList.contains("hidden-sprite") &&
       playerSprite.getAttribute("src")){

        playerSprite.classList.add("talking");

        setTimeout(() =>
            playerSprite.classList.remove("talking"),
            300
        );
    }

    if(speakingSprite &&
       !speakingSprite.classList.contains("hidden-sprite") &&
       speakingSprite.getAttribute("src")){

        speakingSprite.classList.add("talking");

        setTimeout(() =>
            speakingSprite.classList.remove("talking"),
            300
        );
    }
}

   REINICIAR

function restartGame(){

document.addEventListener(

    event => {

        if(
            event.key ===
                "Enter" ||
            event.key ===
                " "
        ){

                document.getElementById(
                    "game"
                );

            if(
                game.classList.contains(
                    "active"
                )
            ){

                advanceDialogue();

            }

        }

    }
);
