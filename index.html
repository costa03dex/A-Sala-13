<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A SALA 13</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080b12;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button{
    font-family:inherit;
}

.screen{
    position:fixed;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}

/* =========================
   MENU
========================= */

#menu{
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at center,#182235 0%,#080b12 65%);
}

.menu-box{
    width:min(700px,90%);
}

.logo{
    font-size:clamp(45px,9vw,90px);
    font-weight:900;
    letter-spacing:8px;
    text-shadow:0 0 30px #4b8cff;
    margin-bottom:10px;
}

.subtitle{
    color:#aeb9ce;
    font-size:18px;
    margin-bottom:45px;
}

.menu-button{
    display:block;
    width:300px;
    max-width:100%;
    margin:14px auto;
    padding:17px;
    border:1px solid #477dff;
    border-radius:10px;
    background:#101827;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.menu-button:hover{
    background:#1d3157;
    transform:translateY(-2px);
    box-shadow:0 0 20px #315fc4;
}

/* =========================
   INTRO
========================= */

#intro{
    align-items:center;
    justify-content:center;
    background:#05070c;
}

.intro-box{
    width:min(850px,90%);
    text-align:center;
}

.intro-text{
    min-height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(22px,4vw,36px);
    line-height:1.4;
    font-weight:bold;
    animation:fadeText .5s;
}

@keyframes fadeText{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
}

.intro-controls{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:40px;
    flex-wrap:wrap;
}

.small-button{
    padding:12px 22px;
    border:1px solid #456bc0;
    background:#101827;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

/* =========================
   SELEÇÃO
========================= */

#selection{
    overflow:auto;
    padding:40px 20px;
    justify-content:center;
    background:
        radial-gradient(circle at top,#17243b,#080b12 70%);
}

.selection-box{
    width:min(1100px,100%);
    text-align:center;
}

.selection-title{
    font-size:38px;
    margin-bottom:8px;
}

.selection-description{
    color:#aab4c7;
    margin-bottom:30px;
}

.characters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
}

.character-card{
    background:#101722;
    border:1px solid #26344d;
    border-radius:12px;
    padding:15px;
    cursor:pointer;
    transition:.2s;
}

.character-card:hover{
    transform:translateY(-5px);
    border-color:#5284ff;
    box-shadow:0 0 18px #1c376b;
}

.character-card.selected{
    border-color:#70a0ff;
    background:#16243c;
    box-shadow:0 0 25px #315ca8;
}

.character-card img{
    width:100%;
    height:180px;
    object-fit:contain;
    display:block;
}

.character-name{
    font-size:17px;
    font-weight:bold;
    margin-top:8px;
}

.character-trait{
    color:#8fa5c7;
    font-size:12px;
    margin-top:5px;
}

.start-game{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
}

.start-game:disabled{
    opacity:.4;
    cursor:not-allowed;
}

/* =========================
   JOGO
========================= */

#game{
    flex-direction:column;
    background:#000;
}

.game-scene{
    position:relative;
    flex:1;
    min-height:0;
    overflow:hidden;
}

#background{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

.scene-dark{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.05),
        rgba(0,0,0,.25) 55%,
        rgba(0,0,0,.8)
    );
    pointer-events:none;
}

.character-sprite{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    height:min(75%,650px);
    max-width:45%;
    object-fit:contain;
    object-position:bottom center;
    filter:drop-shadow(0 10px 15px rgba(0,0,0,.7));
    transition:.3s;
}

.character-sprite.talking{
    transform:translateX(-50%) scale(1.02);
}

/* HUD */

.hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:5;
    pointer-events:none;
}

.hud-box{
    background:rgba(5,8,14,.82);
    border:1px solid #33425c;
    padding:9px 13px;
    border-radius:8px;
    backdrop-filter:blur(5px);
}

.hud-name{
    font-weight:bold;
}

.hud-clues{
    color:#a8b9d8;
    font-size:13px;
}

/* diálogo */

.dialogue-area{
    position:relative;
    z-index:10;
    background:linear-gradient(
        to bottom,
        rgba(5,8,14,.2),
        rgba(5,8,14,.96) 18%
    );
    padding:25px 5% 20px;
}

.dialogue-box{
    max-width:1100px;
    margin:auto;
    position:relative;
}

.speaker{
    display:inline-block;
    background:#2563eb;
    padding:8px 17px;
    border-radius:7px 7px 0 0;
    font-weight:bold;
    min-width:110px;
}

.dialogue-text{
    min-height:90px;
    padding:20px;
    background:rgba(14,20,31,.97);
    border:1px solid #34445f;
    border-radius:0 10px 10px 10px;
    font-size:18px;
    line-height:1.5;
    cursor:pointer;
}

.continue-hint{
    text-align:right;
    color:#8190a9;
    font-size:12px;
    margin-top:7px;
}

/* escolhas */

.choices{
    display:none;
    max-width:900px;
    margin:12px auto 0;
    gap:10px;
    flex-wrap:wrap;
}

.choice{
    flex:1;
    min-width:180px;
    padding:13px;
    background:#101827;
    border:1px solid #3c5277;
    color:white;
    border-radius:8px;
    cursor:pointer;
    text-align:left;
}

.choice:hover{
    background:#1c2d4b;
    border-color:#6591e9;
}

/* =========================
   MODAL / PISTAS
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.75);
    padding:20px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(650px,100%);
    background:#101722;
    border:1px solid #405477;
    border-radius:14px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
}

.modal-box h2{
    margin-bottom:15px;
}

.modal-box p{
    color:#c0cad9;
    line-height:1.6;
}

.modal-close{
    margin-top:20px;
    padding:10px 20px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:7px;
    cursor:pointer;
}

/* =========================
   FINAL
========================= */

#ending{
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle,#1a2944,#06080d 70%);
    padding:30px;
}

.ending-box{
    max-width:750px;
}

.ending-title{
    font-size:clamp(35px,7vw,65px);
    font-weight:900;
    margin-bottom:20px;
}

.ending-text{
    color:#c0c9d8;
    line-height:1.7;
    font-size:18px;
}

.ending-button{
    margin-top:30px;
    padding:14px 28px;
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:700px){

    .logo{
        letter-spacing:3px;
    }

    .character-sprite{
        height:55%;
        max-width:70%;
    }

    .dialogue-area{
        padding:15px;
    }

    .dialogue-text{
        font-size:15px;
        min-height:100px;
    }

    .characters{
        grid-template-columns:repeat(2,1fr);
    }

    .character-card img{
        height:145px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<section id="menu" class="screen active">

    <div class="menu-box">

        <div class="logo">A SALA 13</div>

        <div class="subtitle">
            Um mistério escolar onde nada é o que parece.
        </div>

        <button class="menu-button" onclick="startIntro()">
            COMEÇAR
        </button>

        <button class="menu-button" onclick="continueGame()">
            CONTINUAR
        </button>

    </div>

</section>


<!-- =========================
     INTRO
========================= -->

<section id="intro" class="screen">

    <div class="intro-box">

        <div id="introText" class="intro-text"></div>

        <div class="intro-controls">

            <button class="small-button" onclick="nextIntro()">
                CONTINUAR
            </button>

            <button class="small-button" onclick="skipIntro()">
                PULAR INTRO
            </button>

        </div>

    </div>

</section>


<!-- =========================
     SELEÇÃO
========================= -->

<section id="selection" class="screen">

    <div class="selection-box">

        <h1 class="selection-title">
            Escolha seu personagem
        </h1>

        <p class="selection-description">
            Cada personagem possui uma habilidade diferente.
        </p>

        <div id="characters" class="characters"></div>

        <button id="startButton"
                class="start-game"
                disabled
                onclick="startGame()">
            ENTRAR NA HISTÓRIA
        </button>

    </div>

</section>


<!-- =========================
     JOGO
========================= -->

<section id="game" class="screen">

    <div class="game-scene">

        <img id="background"
             src="sala-aula.png"
             alt="Cenário">

        <div class="scene-dark"></div>

        <div class="hud">

            <div class="hud-box">
                <div id="hudName" class="hud-name">
                    -
                </div>

                <div id="hudAbility" class="hud-clues">
                    -
                </div>
            </div>

            <div class="hud-box">
                <div class="hud-clues">
                    PISTAS
                </div>

                <div id="clueCount">
                    0 / 3
                </div>
            </div>

        </div>

        <img id="characterSprite"
             class="character-sprite"
             src=""
             alt="Personagem">

    </div>

    <div class="dialogue-area">

        <div class="dialogue-box">

            <div id="speaker" class="speaker">
                Narrador
            </div>

            <div id="dialogueText"
                 class="dialogue-text"
                 onclick="advanceDialogue()">
            </div>

            <div class="continue-hint">
                Clique na caixa para continuar
            </div>

            <div id="choices" class="choices"></div>

        </div>

    </div>

</section>


<!-- =========================
     FINAL
========================= -->

<section id="ending" class="screen">

    <div class="ending-box">

        <div id="endingTitle" class="ending-title">
            -
        </div>

        <p id="endingText" class="ending-text">
            -
        </p>

        <button class="ending-button" onclick="location.reload()">
            JOGAR NOVAMENTE
        </button>

    </div>

</section>


<!-- =========================
     MODAL
========================= -->

<div id="clueModal" class="modal">

    <div class="modal-box">

        <h2 id="clueTitle">
            Pista encontrada
        </h2>

        <p id="clueDescription">
            -
        </p>

        <button class="modal-close" onclick="closeClue()">
            CONTINUAR
        </button>

    </div>

</div>


<script>

/* =====================================================
   PERSONAGENS
===================================================== */

const characters = [

    {
        id:"cibelly",
        name:"Cibelly",
        image:"cibelly.png",
        trait:"Engraçada, descontraída e tranquila.",
        ability:"Descontração"
    },

    {
        id:"fernanda",
        name:"Fernanda",
        image:"fernanda.png",
        trait:"Quieta, educada, engraçada e observadora.",
        ability:"Observação Silenciosa"
    },

    {
        id:"rosana",
        name:"Rosana",
        image:"rosana.png",
        trait:"Gótica, nerd e fã de animes e K-pop.",
        ability:"Investigação"
    },

    {
        id:"anna-laura",
        name:"Anna Laura",
        image:"anna-laura.png",
        trait:"Inteligente, educada e muito nerd.",
        ability:"Lógica"
    },

    {
        id:"camylle",
        name:"Camylle",
        image:"camylle.png",
        trait:"Simpática, educada e fã de K-pop.",
        ability:"Empatia"
    },

    {
        id:"avylla",
        name:"Avylla",
        image:"avylla.png",
        trait:"Ama matemática, livros e é muito engraçada.",
        ability:"Matemática"
    },

    {
        id:"costa",
        name:"Costa",
        image:"costa.png",
        trait:"Cristã, engraçada e apaixonada por música.",
        ability:"Música"
    },

    {
        id:"joao-arthur",
        name:"João Arthur",
        image:"joao-arthur.png",
        trait:"Gente boa, engraçado e fã de esportes.",
        ability:"Atletismo"
    },

    {
        id:"kaio",
        name:"Kaio",
        image:"kaio.png",
        trait:"Engraçado, gente boa e fã de esportes.",
        ability:"Reflexo"
    },

    {
        id:"joao-felipe",
        name:"João Felipe",
        image:"joao-felipe.png",
        trait:"Sonolento, engraçado e gente boa.",
        ability:"Modo Soneca"
    },

    {
        id:"lucca",
        name:"Lucca",
        image:"lucca.png",
        trait:"Engraçado e especialista em imitar divas pop.",
        ability:"Performance"
    }

];


/* =====================================================
   ESTADO
===================================================== */

let selectedCharacter = null;

let currentDialogue = 0;

let currentScene = "aula";

let clues = [];

let introIndex = 0;


/* =====================================================
   INTRO
===================================================== */

const introTexts = [

    "Tudo começou em uma sexta-feira aparentemente normal...",

    "Era o último período. A turma só queria ir embora.",

    "Até que o sinal tocou.",

    "Mas quando os alunos tentaram sair...",

    "A porta estava trancada.",

    "Os celulares ficaram sem sinal.",

    "As luzes começaram a piscar.",

    "E o relógio da escola parou.",

    "13:13.",

    "Então uma mensagem apareceu.",

    "ENCONTREM A SALA 13.",

    "O problema era simples...",

    "A escola não tinha uma Sala 13.",

    "E foi aí que tudo começou."

];


function startIntro(){

    showScreen("intro");

    introIndex = 0;

    showIntroText();
}


function showIntroText(){

    const element = document.getElementById("introText");

    element.style.animation = "none";

    void element.offsetWidth;

    element.style.animation = "fadeText .5s";

    element.textContent = introTexts[introIndex];
}


function nextIntro(){

    introIndex++;

    if(introIndex >= introTexts.length){

        showCharacterSelection();

        return;
    }

    showIntroText();
}


function skipIntro(){

    showCharacterSelection();
}


/* =====================================================
   TELAS
===================================================== */

function showScreen(id){

    document.querySelectorAll(".screen")
        .forEach(screen => screen.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");
}


/* =====================================================
   PERSONAGENS
===================================================== */

function showCharacterSelection(){

    showScreen("selection");

    const container =
        document.getElementById("characters");

    container.innerHTML = "";

    characters.forEach(character => {

        const card = document.createElement("div");

        card.className = "character-card";

        card.innerHTML = `

            <img src="${character.image}"
                 alt="${character.name}">

            <div class="character-name">
                ${character.name}
            </div>

            <div class="character-trait">
                ${character.trait}
            </div>

            <div class="character-trait">
                Habilidade: ${character.ability}
            </div>

        `;

        card.onclick = () => selectCharacter(character,card);

        container.appendChild(card);

    });

}


function selectCharacter(character,card){

    selectedCharacter = character;

    document.querySelectorAll(".character-card")
        .forEach(c => c.classList.remove("selected"));

    card.classList.add("selected");

    document.getElementById("startButton")
        .disabled = false;
}


/* =====================================================
   COMEÇAR JOGO
===================================================== */

function startGame(){

    if(!selectedCharacter) return;

    localStorage.setItem(
        "sala13_character",
        selectedCharacter.id
    );

    showScreen("game");

    document.getElementById("hudName")
        .textContent = selectedCharacter.name;

    document.getElementById("hudAbility")
        .textContent =
        "Habilidade: " + selectedCharacter.ability;

    document.getElementById("characterSprite")
        .src = selectedCharacter.image;

    currentScene = "aula";

    clues = [];

    currentDialogue = 0;

    startStory();
}


/* =====================================================
   CONTINUAR
===================================================== */

function continueGame(){

    const saved =
        localStorage.getItem("sala13_character");

    if(!saved){

        alert("Ainda não existe um jogo salvo.");

        return;
    }

    const found =
        characters.find(c => c.id === saved);

    if(!found){

        alert("Não foi possível carregar o personagem.");

        return;
    }

    selectedCharacter = found;

    showScreen("game");

    document.getElementById("hudName")
        .textContent = selectedCharacter.name;

    document.getElementById("hudAbility")
        .textContent =
        "Habilidade: " + selectedCharacter.ability;

    document.getElementById("characterSprite")
        .src = selectedCharacter.image;

    currentScene = "aula";

    clues = [];

    currentDialogue = 0;

    startStory();
}


/* =====================================================
   HISTÓRIA PRINCIPAL
===================================================== */

const story = [

    {
        speaker:"Narrador",
        text:() =>
            `Você é ${selectedCharacter.name}. O último período finalmente terminou, mas alguma coisa está errada.`
    },

    {
        speaker:"Narrador",
        text:() =>
            "O sinal toca. Todos começam a guardar as coisas."
    },

    {
        speaker:"Beto",
        text:() =>
            "Pessoal, calma. Vou tentar abrir a porta."
    },

    {
        speaker:"Beto",
        text:() =>
            "Não adianta. A porta está realmente trancada."
    },

    {
        speaker:"Douglas",
        text:() =>
            "Todo mundo fica junto. Ninguém vai sair andando sozinho por aí."
    },

    {
        speaker:"Mara",
        text:() =>
            "Isso não parece ser um problema comum. O sistema eletrônico da escola também está bloqueado."
    },

    {
        speaker:"Narrador",
        text:() =>
            "As luzes piscam novamente."
    },

    {
        speaker:"Desconhecido",
        text:() =>
            "ENCONTREM A SALA 13."
    },

    {
        speaker:"Beto",
        text:() =>
            "Sala 13...? Essa sala não existe."
    },

    {
        speaker:"Narrador",
        text:() =>
            "Mas se a Sala 13 não existe... por que alguém está pedindo para vocês encontrá-la?"
    }

];


function startStory(){

    currentDialogue = 0;

    setScene("aula");

    showDialogue();
}


function showDialogue(){

    if(currentDialogue >= story.length){

        showMainInvestigation();

        return;
    }

    const line = story[currentDialogue];

    document.getElementById("speaker")
        .textContent =
        typeof line.speaker === "function"
        ? line.speaker()
        : line.speaker;

    document.getElementById("dialogueText")
        .textContent =
        typeof line.text === "function"
        ? line.text()
        : line.text;

    document.getElementById("choices").style.display = "none";

    const sprite =
        document.getElementById("characterSprite");

    sprite.classList.add("talking");

    setTimeout(() => {
        sprite.classList.remove("talking");
    },300);
}


function advanceDialogue(){

    if(
        document.getElementById("choices").style.display === "flex"
    ){
        return;
    }

    currentDialogue++;

    showDialogue();
}


/* =====================================================
   INVESTIGAÇÃO
===================================================== */

function showMainInvestigation(){

    setDialogue(
        "Narrador",
        "Vocês precisam descobrir de onde veio a mensagem."
    );

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    const locations = [

        {
            name:"📚 Investigar a biblioteca",
            scene:"biblioteca",
            clue:"biblioteca"
        },

        {
            name:"🤖 Investigar a robótica",
            scene:"robotica",
            clue:"robotica"
        },

        {
            name:"📐 Investigar a matemática",
            scene:"matematica",
            clue:"matematica"
        },

        {
            name:"🌎 Investigar a geografia",
            scene:"geografia",
            clue:"geografia"
        },

        {
            name:"🍽️ Investigar a cantina",
            scene:"cantina",
            clue:"cantina"
        },

        {
            name:"🏀 Investigar a quadra",
            scene:"quadra",
            clue:"quadra"
        },

        {
            name:"🚪 Investigar a direção",
            scene:"direcao",
            clue:"direcao"
        }

    ];

    locations.forEach(location => {

        const button =
            document.createElement("button");

        button.className = "choice";

        button.textContent = location.name;

        button.onclick = () => {

            investigate(location);

        };

        choices.appendChild(button);

    });

    choices.style.display = "flex";
}


/* =====================================================
   INVESTIGAR
===================================================== */

const clueData = {

    biblioteca:{
        title:"PLANTA ANTIGA",
        description:
            "Entre livros antigos, vocês encontram uma planta da escola. Uma sala aparece no documento, mas ela não existe na planta atual: SALA 13."
    },

    robotica:{
        title:"O SISTEMA",
        description:
            "Um computador mostra registros automáticos. O bloqueio da escola começou exatamente às 13:13."
    },

    matematica:{
        title:"O PAINEL",
        description:
            "Atrás do quadro existe um pequeno painel numérico. Os números parecem formar uma sequência ligada ao número 13."
    },

    geografia:{
        title:"MAPA ANTIGO",
        description:
            "Anny encontra um mapa antigo. Uma parte da escola foi modificada e fechada há muitos anos."
    },

    cantina:{
        title:"A CAIXA",
        description:
            "Dentro de uma caixa antiga há um papel dobrado. Nele existe apenas um número escrito: 13."
    },

    quadra:{
        title:"A PORTA",
        description:
            "Perto da quadra existe uma porta antiga que não aparece nos mapas atuais."
    },

    direcao:{
        title:"O CADERNO",
        description:
            "Na direção existe um caderno antigo com registros de várias turmas. Alguns nomes da turma aparecem nele."
    }

};


function investigate(location){

    setScene(location.scene);

    if(!clues.includes(location.clue)){

        clues.push(location.clue);

        updateClueCount();

        showClue(
            clueData[location.clue].title,
            clueData[location.clue].description
        );

    }else{

        setDialogue(
            "Narrador",
            "Vocês já investigaram esse lugar."
        );

    }

}


function updateClueCount(){

    document.getElementById("clueCount")
        .textContent =
        clues.length + " / 3";

}


/* =====================================================
   MODAL DE PISTA
===================================================== */

function showClue(title,description){

    document.getElementById("clueTitle")
        .textContent = title;

    document.getElementById("clueDescription")
        .textContent = description;

    document.getElementById("clueModal")
        .classList.add("active");

}


function closeClue(){

    document.getElementById("clueModal")
        .classList.remove("active");

    if(clues.length >= 3){

        showAfterInvestigation();

    }else{

        showMainInvestigation();

    }

}


/* =====================================================
   SEGUNDA PARTE
===================================================== */

function showAfterInvestigation(){

    setDialogue(
        "Narrador",
        "As pistas começam a formar uma imagem. Agora vocês precisam decidir em quem confiar."
    );

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    const options = [

        {
            text:"🔎 Procurar a Sala 13",
            action:goToRoom13
        },

        {
            text:"🌎 Conversar com Anny",
            action:talkAnny
        },

        {
            text:"📐 Conversar com Beto",
            action:talkBeto
        }

    ];

    options.forEach(option => {

        const button =
            document.createElement("button");

        button.className = "choice";

        button.textContent = option.text;

        button.onclick = option.action;

        choices.appendChild(button);

    });

    choices.style.display = "flex";
}


/* =====================================================
   ANNY
===================================================== */

function talkAnny(){

    setScene("geografia");

    setDialogue(
        "Anny",
        "Eu já vi esse mapa antes... essa parte antiga da escola foi fechada há muitos anos."
    );

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    addChoice(
        "Por que ela foi fechada?",
        () => {

            setDialogue(
                "Anny",
                "Eu não sei toda a história. Mas lembro que existia uma sala naquela área."
            );

            addChoice(
                "Era a Sala 13?",
                goToRoom13
            );

        }
    );

    choices.style.display = "flex";
}


/* =====================================================
   BETO
===================================================== */

function talkBeto(){

    setScene("matematica");

    setDialogue(
        "Beto",
        "Eu disse que a Sala 13 não existe... mas talvez eu tenha sido rápido demais ao dizer isso."
    );

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    addChoice(
        "Você sabia dessa sala?",
        () => {

            setDialogue(
                "Beto",
                "Eu sabia que havia uma parte antiga da escola. O que eu não sabia era que ela ainda poderia estar acessível."
            );

            addChoice(
                "Então vamos procurar.",
                goToRoom13
            );

        }
    );

    choices.style.display = "flex";
}


/* =====================================================
   SALA 13
===================================================== */

function goToRoom13(){

    setScene("sala-13");

    setDialogue(
        "Narrador",
        "Depois de seguir as pistas, vocês encontram uma passagem escondida."
    );

    const choices =
        document.getElementById("choices");

    choices.innerHTML = "";

    addChoice(
        "🚪 Abrir a porta",
        openRoom13
    );

    addChoice(
        "🔍 Investigar a porta primeiro",
        investigateDoor
    );

    addChoice(
        "↩️ Ir embora",
        escapeEnding
    );

    choices.style.display = "flex";
}


function investigateDoor(){

    setDialogue(
        "Narrador",
        "Há marcas antigas na porta. Acima dela existe um pequeno número quase apagado."
    );

    addChoice(
        "13",
        openRoom13
    );

    document.getElementById("choices").style.display = "flex";
}


function openRoom13(){

    setScene("sala-13");

    if(clues.length >= 5){

        trueEnding();

    }else{

        mysteriousEnding();

    }
}


/* =====================================================
   FINAIS
===================================================== */

function trueEnding(){

    localStorage.removeItem("sala13_character");

    showScreen("ending");

    document.getElementById("endingTitle")
        .textContent =
        "A VERDADE";

    document.getElementById("endingText")
        .textContent =
        "A porta se abre. Dentro da Sala 13 vocês encontram registros antigos da escola e descobrem que a sala foi retirada oficialmente dos mapas após uma reforma. O sistema que trancou a escola estava conectado a um antigo projeto de segurança. A mensagem não era um simples trote: alguém queria que a turma descobrisse o que havia sido escondido.";

}


function mysteriousEnding(){

    localStorage.removeItem("sala13_character");

    showScreen("ending");

    document.getElementById("endingTitle")
        .textContent =
        "AINDA HÁ SEGREDOS";

    document.getElementById("endingText")
        .textContent =
        "A porta da Sala 13 se abre apenas por alguns segundos. Vocês conseguem ver uma sala antiga, cheia de documentos, mas as luzes se apagam. Quando voltam a enxergar, a porta está fechada. Vocês descobriram a Sala 13... mas ainda não descobriram toda a verdade.";

}


function escapeEnding(){

    localStorage.removeItem("sala13_character");

    showScreen("ending");

    document.getElementById("endingTitle")
        .textContent =
        "A FUGA";

    document.getElementById("endingText")
        .textContent =
        "Vocês decidem não arriscar. Depois de algum tempo, o bloqueio desaparece e a porta da escola finalmente abre. A turma consegue ir embora, mas a pergunta continua: quem enviou a mensagem sobre a Sala 13?";

}


/* =====================================================
   UTILIDADES
===================================================== */

function setScene(scene){

    const scenes = {

        aula:"sala-aula.png",

        corredor:"corredor.png",

        biblioteca:"biblioteca.png",

        robotica:"robotica.png",

        matematica:"matematica.png",

        geografia:"geografia.png",

        cantina:"cantina.png",

        quadra:"quadra.png",

        direcao:"direcao.png",

        "sala-13":"sala-13.png"

    };

    if(scenes[scene]){

        document.getElementById("background")
            .src = scenes[scene];

        currentScene = scene;

    }
}


function setDialogue(speaker,text){

    document.getElementById("speaker")
        .textContent = speaker;

    document.getElementById("dialogueText")
        .textContent = text;

}


function addChoice(text,action){

    const choices =
        document.getElementById("choices");

    const button =
        document.createElement("button");

    button.className = "choice";

    button.textContent = text;

    button.onclick = action;

    choices.appendChild(button);
}


/* =====================================================
   TECLA ENTER / ESPAÇO
===================================================== */

document.addEventListener("keydown",event => {

    if(
        event.key === "Enter" ||
        event.key === " "
    ){

        const game =
            document.getElementById("game");

        if(game.classList.contains("active")){

            advanceDialogue();

        }

    }

});

</script>
